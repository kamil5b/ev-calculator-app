name: CI

# Runs the full Definition of Done check on every pull request and on pushes to
# branches other than main (main deploys through deploy.yml).
on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Test, lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit and component tests
        run: npm run test

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build

      - name: Verify the size budget
        run: node scripts/check-budget.mjs
