name: Deploy to GitHub Pages

# PRD 14: push to main → tests run → build → deploy to GitHub Pages.
on:
  push:
    branches: [main]
  # Manual re-run from the Actions tab, plus a safety net if the first deploy fails.
  workflow_dispatch:

# Only one deployment at a time; never cancel a deploy that is already live.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Test, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit and component tests
        run: npm run test

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build
        env:
          # The app is served from https://<owner>.github.io/<repo>/.
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}

      - name: Verify the size budget
        run: node scripts/check-budget.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
